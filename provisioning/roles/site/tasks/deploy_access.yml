---
- name: Create deployment account
  ansible.builtin.user:
    name: "{{ deploy_user }}"
    password: '!'
    groups: docker
    append: true
    shell: /bin/bash
    create_home: true
- name: Create deployment SSH directory
  ansible.builtin.file:
    path: "/home/{{ deploy_user }}/.ssh"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: '0700'
- name: Install managed deployment public keys
  ansible.builtin.copy:
    content: "{{ deploy_public_keys | join('\n') }}\n"
    dest: "/home/{{ deploy_user }}/.ssh/authorized_keys"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_user }}"
    mode: '0600'
  when: deploy_public_keys | length > 0
