---
- name: Check operating system
  ansible.builtin.assert:
    that:
      - ansible_distribution in ['Ubuntu', 'Debian']
      - ansible_architecture in ['x86_64', 'aarch64']
    fail_msg: Use Ubuntu or Debian on amd64 or arm64.
- name: Install prerequisites
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, python3, cron]
    state: present
    update_cache: true
    cache_valid_time: 3600
- name: Create keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
- name: Install Docker repository key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'
- name: Configure Docker repository
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} stable"
    filename: docker
    state: present
- name: Install Docker and Compose plugin
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
    state: present
    update_cache: true
- name: Enable Docker and cron
  ansible.builtin.service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [docker, cron]
